services:
  deye-api:
    build: .
    image: deye-rpi-api
    container_name: deye-api
    env_file: .env
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8090}:8080"   # LAN access (ESP32) and Cloudflare Tunnel via localhost
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
