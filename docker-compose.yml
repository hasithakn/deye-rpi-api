services:
  api:
    build: .
    image: deye-pi-api
    env_file: .env
    restart: unless-stopped
    ports:
      - "8080:8080"            # LAN access (ESP32)
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # Optional Cloudflare Tunnel: docker compose --profile tunnel up -d
  # In the Cloudflare dashboard, point the public hostname to http://api:8080
  cloudflared:
    image: cloudflare/cloudflared:2024.12.2
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    restart: unless-stopped
    depends_on: [api]
    profiles: [tunnel]
